name: Publish to AUR

on:
  push:
    branches: [main]
    paths: ['PKGBUILD']
  workflow_dispatch:

concurrency:
  group: aur-publish
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    name: Build, verify and push
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Install git and build prerequisites
        # archlinux:base-devel 镜像不含 git；必须先装 git，否则后续 checkout
        # 会静默回退为 REST 快照（无 .git），导致提交与推送步骤全部失败。
        run: |
          pacman -Syu --noconfirm --needed git sudo namcap openssh
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/builder

      - name: Check out packaging repository
        uses: actions/checkout@v6
        with:
          # AUR 拒绝浅克隆推送（shallow update not allowed），必须完整历史
          fetch-depth: 0

      - name: Hand workspace to build user
        run: chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Build package
        run: sudo -u builder -- makepkg -s --noconfirm --clean --cleanbuild

      - name: Lint with namcap
        run: |
          namcap PKGBUILD
          namcap ./*.pkg.tar.zst

      - name: Regenerate .SRCINFO
        run: |
          sudo -u builder -- makepkg --printsrcinfo > .SRCINFO
          rm -f ./*.pkg.tar.zst

      - name: Commit .SRCINFO back to repository
        run: |
          # 构建步骤把工作区 chown 给了 builder，root 执行 git 前需声明 safe.directory
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PKGBUILD .SRCINFO
          if git diff --cached --quiet; then
            echo 'No packaging changes to commit.'
            exit 0
          fi
          pkgver_now=$(sed -n 's/^pkgver = //p' .SRCINFO | head -n1)
          git commit -m "Update lunalauncher-git to ${pkgver_now}"
          git push origin HEAD:main

      - name: Push to AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          # 容器作业中 $HOME=/github/home，但 ssh 按 root 的 pw_dir 读 /root/.ssh，
          # 一律使用显式路径避免错位。
          install -d -m 700 /root/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > /root/.ssh/aur_key
          chmod 600 /root/.ssh/aur_key
          ssh-keyscan -H aur.archlinux.org >> /root/.ssh/known_hosts
          export GIT_SSH_COMMAND='ssh -i /root/.ssh/aur_key -o IdentitiesOnly=yes -o UserKnownHostsFile=/root/.ssh/known_hosts'
          aur_remote=ssh://aur@aur.archlinux.org/lunalauncher-git.git
          git fetch "$aur_remote" master:refs/remotes/aur/master || true

          # AUR 包仓库不允许子目录：用临时索引构造仅含打包文件的扁平提交，
          # 并以 AUR 端当前 master 为父提交，保持快进历史。
          tmp_index=$(mktemp)
          trap 'rm -f "$tmp_index"' EXIT
          export GIT_INDEX_FILE="$tmp_index"
          export GIT_AUTHOR_NAME='github-actions[bot]'
          export GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com'
          export GIT_COMMITTER_NAME='github-actions[bot]'
          export GIT_COMMITTER_EMAIL='41898282+github-actions[bot]@users.noreply.github.com'

          parent=$(git rev-parse --verify refs/remotes/aur/master 2>/dev/null || true)
          if [ -n "$parent" ]; then
            git read-tree "$parent"
          else
            git read-tree --empty
          fi
          git add PKGBUILD .SRCINFO
          tree=$(git write-tree)

          if [ -n "$parent" ] && [ "$tree" = "$(git rev-parse "$parent^{tree}")" ]; then
            echo 'AUR content unchanged; nothing to push.'
            exit 0
          fi

          pkgver_now=$(sed -n 's/^pkgver = //p' .SRCINFO | head -n1)
          if [ -n "$parent" ]; then
            commit=$(git commit-tree "$tree" -p "$parent" -m "Update lunalauncher-git to ${pkgver_now}")
          else
            commit=$(git commit-tree "$tree" -m "Import lunalauncher-git ${pkgver_now}")
          fi
          git push "$aur_remote" "$commit:refs/heads/master"
