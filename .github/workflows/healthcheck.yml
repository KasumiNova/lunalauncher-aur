name: Weekly health check

on:
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  issues: write

jobs:
  check:
    name: Build upstream HEAD and detect drift
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    steps:
      - name: Check out packaging repository
        uses: actions/checkout@v6

      - name: Prepare container and build user
        run: |
          pacman -Syu --noconfirm --needed namcap curl
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD:ALL' > /etc/sudoers.d/builder
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Detect upstream option drift
        run: |
          set -euo pipefail
          options_url='https://raw.githubusercontent.com/AndreaFrederica/LunaLauncher/meson/meson_options.txt'
          curl -fsSL "$options_url" -o /tmp/meson_options.txt
          missing=0
          for opt in $(sed -n 's/^ *-D\([A-Za-z_]*\)=.*/\1/p' PKGBUILD | sort -u); do
            if ! grep -q "option('$opt'" /tmp/meson_options.txt; then
              echo "::warning::PKGBUILD uses -D$opt but upstream meson_options.txt no longer defines it"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo 'Upstream meson options drifted from PKGBUILD; manual review required.' >&2
            exit 1
          fi

      - name: Build upstream HEAD
        run: sudo -u builder -- makepkg -s --noconfirm --clean --cleanbuild

      - name: Lint with namcap
        run: |
          namcap PKGBUILD
          namcap ./*.pkg.tar.zst

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const title = 'AUR weekly health check failed';
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const issues = await github.rest.issues.listForRepo({
              owner, repo, state: 'open', labels: 'healthcheck',
            });
            if (issues.data.length > 0) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: issues.data[0].number,
                body: `Health check failed again: ${runUrl}`,
              });
              return;
            }
            await github.rest.issues.create({
              owner, repo, title,
              labels: ['healthcheck'],
              body: `Weekly build or drift check failed.\n\nRun: ${runUrl}`,
            });
